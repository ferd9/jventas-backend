spring:
  application:
    name: jventas-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jventas}
    username: ${DB_USER:jventas}
    password: ${DB_PASSWORD:jventas}

  jpa:
    # El esquema lo gobierna Flyway, no Hibernate: "validate" detecta un
    # desfase entidad<->tabla en vez de intentar corregirlo silenciosamente.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8081}   # 8080 suele estar ocupado por otros proyectos locales

management:
  endpoints:
    web:
      exposure:
        include: health,info

jventas:
  cors:
    # Orígenes del/los frontend(s) que pueden llamar a la API. Sin esto,
    # el navegador bloquea las llamadas aunque el token sea válido.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      # Vacío en local: se genera una clave aleatoria en cada arranque (ver
      # JwtService). Definir siempre en cualquier entorno compartido.
      secret: ${JWT_SECRET:}
      # Corto a propósito -- la sesión larga la sostiene el refresh token,
      # no el access token (ver RefreshTokenService).
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  bootstrap:
    admin:
      login: ${ADMIN_LOGIN:admin}
      # Vacío: se genera una contraseña aleatoria y se imprime una sola vez
      # en el log de arranque (ver BootstrapAdminRunner). Nunca hardcodeada.
      password: ${ADMIN_PASSWORD:}
  storage:
    # Directorio local donde se guardan las imágenes subidas (ver
    # ArchivoService). En producción, montar un volumen persistente acá --
    # si no, las imágenes se pierden en cada redeploy.
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.jventas.backend: DEBUG
